spring.application.name=PaymentSystem
server.port=8080

#SqlServer Config
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=db-paymentsystem;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=aguanta23

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
application.security.jwt.secret-key=${JWT-SECRET-KEY}
    # a day
application.security.jwt.expiration=86400000
    # 7 days
application.security.jwt.refresh-token.expiration=604800000